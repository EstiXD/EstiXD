<svg width="1280" height="250" viewBox="0 0 1280 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ESTIX — Full Stack · UX/UI · AI-Driven · Android">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#0b1c38"/>
      <stop offset="0.55" stop-color="#071120"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d8fff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#0d8fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d8fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d8fff"/>
      <stop offset="1" stop-color="#38d0ff"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d8fff"/>
      <stop offset="1" stop-color="#38d0ff"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d0ff"/>
      <stop offset="1" stop-color="#0d8fff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="250" fill="url(#bg)"/>

  <!-- aura electrica detras del wordmark -->
  <ellipse cx="640" cy="105" rx="340" ry="82" fill="url(#aura)"/>

  <!-- chispas -->
  <g fill="#8fe3ff">
    <circle cx="140" cy="52" r="2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="96" r="1.5" fill="#ffb066"><animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="150" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="60" r="2" fill="#ffb066"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="110" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1055" cy="160" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="38" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- brasas que suben, en el naranja del avatar -->
  <g fill="#ff9a4d">
    <circle cx="450" r="1.8" cy="200">
      <animate attributeName="cy" values="200;55" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="835" r="1.5" cy="205">
      <animate attributeName="cy" values="205;70" dur="9s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" r="1.3" cy="198">
      <animate attributeName="cy" values="198;62" dur="8s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark con resplandor -->
  <text x="640" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="12"
        fill="#38d0ff" opacity="0.85" filter="url(#soft)">ESTIX</text>
  <text x="640" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="12" fill="#f2f7ff">EST<tspan fill="#f2f7ff">I</tspan><tspan fill="url(#gx)">X</tspan></text>
  <text x="640" y="152" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif"
        font-size="17" font-weight="600" letter-spacing="4" fill="#9fc5e8">FULL STACK · UX/UI · AI-DRIVEN · ANDROID</text>

  <!-- olas -->
  <path d="M0 205 Q 160 165 320 205 T 640 205 T 960 205 T 1280 205 T 1600 205 T 1920 205 T 2240 205 T 2560 205 V 260 H 0 Z" fill="url(#w2)" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="-1280 0" to="0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <g>
    <path d="M0 215 Q 160 178 320 215 T 640 215 T 960 215 T 1280 215 T 1600 215 T 1920 215 T 2240 215 T 2560 215 V 260 H 0 Z" fill="url(#w1)"/>
    <path d="M0 215 Q 160 178 320 215 T 640 215 T 960 215 T 1280 215 T 1600 215 T 1920 215 T 2240 215 T 2560 215" fill="none" stroke="#b8ecff" stroke-width="2" opacity="0.55"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1280 0" dur="10s" repeatCount="indefinite"/>
  </g>
</svg>
